name: macOS Remote GUI

on:
  workflow_dispatch:

jobs:
  macos-gui:
    # macos-26 is ARM64/M1 on standard GitHub-hosted runners
    runs-on: macos-13

    # 7 days = 10,080 minutes.
    # GitHub-hosted runners still enforce their own maximum job duration.
    timeout-minutes: 10080

    steps:

      # ============================================================
      # MACOS INFORMATION
      # ============================================================

      - name: macOS information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " macOS information"
          echo "========================================"

          echo "Architecture:"
          uname -m

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "User:"
          whoami

          echo
          echo "Python:"
          python3 --version

      # ============================================================
      # INSTALL PYTHON
      # ============================================================

      - name: Install Python packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Installing Python packages"
          echo "========================================"

          python3 -m venv "$HOME/maccontrol-venv"

          source "$HOME/maccontrol-venv/bin/activate"

          python -m pip install --upgrade pip

          python -m pip install \
            Flask \
            pyobjc-framework-Quartz

          mkdir -p "$HOME/maccontrol"

          cd "$HOME/maccontrol"

          # ========================================================
          # PYTHON SERVER
          # ========================================================

          cat > server.py <<'PYTHON'

          import os
          import time
          import threading
          import secrets
          import subprocess

          from flask import Flask, request, Response

          import Quartz


          # ========================================================
          # APP
          # ========================================================

          app = Flask(__name__)


          TOKEN = os.environ["CONTROL_TOKEN"]

          SCREEN = "/tmp/maccontrol-screen.png"


          # ========================================================
          # MACOS KEY CODES
          # ========================================================

          KEY_CODES = {

              "a": 0,
              "s": 1,
              "d": 2,
              "f": 3,
              "h": 4,
              "g": 5,
              "z": 6,
              "x": 7,
              "c": 8,
              "v": 9,

              "b": 11,

              "q": 12,
              "w": 13,
              "e": 14,
              "r": 15,
              "y": 16,
              "t": 17,

              "1": 18,
              "2": 19,
              "3": 20,
              "4": 21,
              "6": 22,
              "5": 23,

              "=": 24,
              "9": 25,
              "7": 26,
              "-": 27,
              "8": 28,
              "0": 29,

              "]": 30,

              "o": 31,
              "u": 32,

              "[": 33,

              "i": 34,
              "p": 35,

              "enter": 36,
              "return": 36,

              "l": 37,
              "j": 38,

              "'": 39,

              "k": 40,

              ";": 41,
              "\\": 42,
              ",": 43,
              "/": 44,

              "n": 45,
              "m": 46,
              ".": 47,

              "tab": 48,

              "space": 49,
              " ": 49,

              "`": 50,

              "backspace": 51,

              "escape": 53,
              "esc": 53,

              "command": 55,
              "meta": 55,

              "shift": 56,

              "capslock": 57,

              "option": 58,
              "alt": 58,

              "control": 59,
              "ctrl": 59,

              "right": 124,
              "arrowright": 124,

              "left": 123,
              "arrowleft": 123,

              "down": 125,
              "arrowdown": 125,

              "up": 126,
              "arrowup": 126,

              "delete": 117,

              "home": 115,
              "end": 119,

              "pageup": 116,
              "pagedown": 121,

              "f1": 122,
              "f2": 120,
              "f3": 99,
              "f4": 118,
              "f5": 96,
              "f6": 97,
              "f7": 98,
              "f8": 100,
              "f9": 101,
              "f10": 109,
              "f11": 103,
              "f12": 111,
          }


          # ========================================================
          # AUTH
          # ========================================================

          def authorized():

              supplied = request.args.get(
                  "token",
                  ""
              )

              if not TOKEN:
                  return False

              return secrets.compare_digest(
                  supplied,
                  TOKEN
              )


          # ========================================================
          # SCREENSHOT LOOP
          # ========================================================

          def screenshot_loop():

              while True:

                  try:

                      subprocess.run(
                          [
                              "/usr/sbin/screencapture",
                              "-x",
                              SCREEN
                          ],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                          timeout=5
                      )

                  except Exception:
                      pass

                  time.sleep(0.3)


          # ========================================================
          # MOUSE CLICK
          # ========================================================

          def click(x, y):

              point = Quartz.CGPoint(
                  float(x),
                  float(y)
              )

              down = Quartz.CGEventCreateMouseEvent(
                  None,
                  Quartz.kCGEventLeftMouseDown,
                  point,
                  Quartz.kCGMouseButtonLeft
              )

              up = Quartz.CGEventCreateMouseEvent(
                  None,
                  Quartz.kCGEventLeftMouseUp,
                  point,
                  Quartz.kCGMouseButtonLeft
              )

              Quartz.CGEventPost(
                  Quartz.kCGHIDEventTap,
                  down
              )

              Quartz.CGEventPost(
                  Quartz.kCGHIDEventTap,
                  up
              )


          # ========================================================
          # UNICODE TEXT
          # ========================================================

          def type_text(text):

              if not text:
                  return

              for char in text:

                  down = Quartz.CGEventCreateKeyboardEvent(
                      None,
                      0,
                      True
                  )

                  Quartz.CGEventKeyboardSetUnicodeString(
                      down,
                      len(char),
                      char
                  )

                  Quartz.CGEventPost(
                      Quartz.kCGHIDEventTap,
                      down
                  )

                  up = Quartz.CGEventCreateKeyboardEvent(
                      None,
                      0,
                      False
                  )

                  Quartz.CGEventKeyboardSetUnicodeString(
                      up,
                      len(char),
                      char
                  )

                  Quartz.CGEventPost(
                      Quartz.kCGHIDEventTap,
                      up
                  )

                  time.sleep(0.005)


          # ========================================================
          # SPECIAL KEY
          # ========================================================

          def press_key(
              key,
              shift=False,
              ctrl=False,
              alt=False,
              meta=False
          ):

              if not key:
                  return

              key_name = str(key).lower()

              keycode = KEY_CODES.get(
                  key_name
              )

              if keycode is None:
                  return

              flags = 0

              if shift:
                  flags |= Quartz.kCGEventFlagMaskShift

              if ctrl:
                  flags |= Quartz.kCGEventFlagMaskControl

              if alt:
                  flags |= Quartz.kCGEventFlagMaskAlternate

              if meta:
                  flags |= Quartz.kCGEventFlagMaskCommand

              down = Quartz.CGEventCreateKeyboardEvent(
                  None,
                  keycode,
                  True
              )

              up = Quartz.CGEventCreateKeyboardEvent(
                  None,
                  keycode,
                  False
              )

              Quartz.CGEventSetFlags(
                  down,
                  flags
              )

              Quartz.CGEventSetFlags(
                  up,
                  flags
              )

              Quartz.CGEventPost(
                  Quartz.kCGHIDEventTap,
                  down
              )

              Quartz.CGEventPost(
                  Quartz.kCGHIDEventTap,
                  up
              )

              time.sleep(0.01)


          # ========================================================
          # WEB UI
          # ========================================================

          @app.route("/")
          def index():

              if not authorized():
                  return "Unauthorized", 401

              return """
              <!DOCTYPE html>

              <html>

              <head>

                  <meta
                      name="viewport"
                      content="width=device-width,initial-scale=1"
                  >

                  <title>macOS Remote Desktop</title>

                  <style>

                      html,
                      body {

                          margin: 0;
                          padding: 0;

                          background: #111;
                          color: white;

                          font-family:
                              Arial,
                              sans-serif;

                          overflow: hidden;
                      }


                      #bar {

                          height: 50px;

                          display: flex;

                          align-items: center;

                          gap: 8px;

                          padding: 0 10px;

                          background: #222;

                          box-sizing: border-box;
                      }


                      #screen {

                          display: block;

                          max-width: 100vw;

                          max-height:
                              calc(100vh - 50px);

                          margin: auto;

                          cursor: crosshair;

                          user-select: none;

                          -webkit-user-drag: none;
                      }


                      input {

                          background: #333;

                          color: white;

                          border:
                              1px solid #555;

                          padding: 7px;

                          width: 220px;
                      }


                      button {

                          padding:
                              7px 12px;

                          cursor: pointer;
                      }


                      #status {

                          color: #6f6;
                      }

                  </style>

              </head>


              <body>

                  <div id="bar">

                      <b>macOS</b>

                      <input
                          id="text"
                          placeholder="Type text"
                          autocomplete="off"
                      >

                      <button
                          onclick="sendText()"
                      >
                          Type
                      </button>

                      <span id="status">
                          Connecting...
                      </span>

                  </div>


                  <img
                      id="screen"
                      draggable="false"
                  >


                  <script>

                      const token =
                          new URLSearchParams(
                              location.search
                          ).get("token") || "";


                      const img =
                          document.getElementById(
                              "screen"
                          );


                      const status =
                          document.getElementById(
                              "status"
                          );


                      // =================================================
                      // SCREEN REFRESH
                      // =================================================

                      async function refresh() {

                          try {

                              const r =
                                  await fetch(
                                      "/screen?token=" +
                                      encodeURIComponent(
                                          token
                                      ) +
                                      "&t=" +
                                      Date.now(),
                                      {
                                          cache:
                                              "no-store"
                                      }
                                  );


                              if (!r.ok) {

                                  status.textContent =
                                      "Error";

                                  return;
                              }


                              const blob =
                                  await r.blob();


                              const old =
                                  img.src;


                              img.src =
                                  URL.createObjectURL(
                                      blob
                                  );


                              if (
                                  old.startsWith(
                                      "blob:"
                                  )
                              ) {

                                  URL.revokeObjectURL(
                                      old
                                  );
                              }


                              status.textContent =
                                  "Connected";

                          }

                          catch (e) {

                              status.textContent =
                                  "Disconnected";
                          }
                      }


                      setInterval(
                          refresh,
                          300
                      );


                      refresh();


                      // =================================================
                      // MOUSE
                      // =================================================

                      img.addEventListener(
                          "click",
                          async function(event) {

                              const rect =
                                  img.getBoundingClientRect();


                              const x =
                                  (
                                      event.clientX -
                                      rect.left
                                  ) *
                                  img.naturalWidth /
                                  rect.width;


                              const y =
                                  (
                                      event.clientY -
                                      rect.top
                                  ) *
                                  img.naturalHeight /
                                  rect.height;


                              await fetch(
                                  "/click?token=" +
                                  encodeURIComponent(
                                      token
                                  ),
                                  {

                                      method:
                                          "POST",

                                      headers: {
                                          "Content-Type":
                                              "application/json"
                                      },

                                      body:
                                          JSON.stringify({
                                              x: x,
                                              y: y
                                          })
                                  }
                              );

                          }
                      );


                      // =================================================
                      // TEXT BOX
                      // =================================================

                      async function sendText() {

                          const input =
                              document.getElementById(
                                  "text"
                              );


                          const text =
                              input.value;


                          if (!text) {
                              return;
                          }


                          await fetch(
                              "/type?token=" +
                              encodeURIComponent(
                                  token
                              ),
                              {

                                  method:
                                      "POST",

                                  headers: {
                                      "Content-Type":
                                          "application/json"
                                  },

                                  body:
                                      JSON.stringify({
                                          text: text
                                      })
                              }
                          );


                          input.value = "";
                      }


                      // =================================================
                      // REMOTE KEYBOARD
                      // =================================================

                      document.addEventListener(
                          "keydown",
                          async function(event) {

                              /*
                               * If the user is typing into
                               * the text box, don't send
                               * those keys separately.
                               */

                              if (
                                  event.target.tagName ===
                                  "INPUT"
                              ) {

                                  return;
                              }


                              event.preventDefault();


                              /*
                               * Special keys.
                               */

                              const specialKeys = [
                                  "Enter",
                                  "Backspace",
                                  "Tab",
                                  "Escape",
                                  "Delete",
                                  "ArrowUp",
                                  "ArrowDown",
                                  "ArrowLeft",
                                  "ArrowRight",
                                  "Home",
                                  "End",
                                  "PageUp",
                                  "PageDown",
                                  "F1",
                                  "F2",
                                  "F3",
                                  "F4",
                                  "F5",
                                  "F6",
                                  "F7",
                                  "F8",
                                  "F9",
                                  "F10",
                                  "F11",
                                  "F12"
                              ];


                              if (
                                  specialKeys.includes(
                                      event.key
                                  )
                              ) {

                                  await fetch(
                                      "/key?token=" +
                                      encodeURIComponent(
                                          token
                                      ),
                                      {

                                          method:
                                              "POST",

                                          headers: {
                                              "Content-Type":
                                                  "application/json"
                                          },

                                          body:
                                              JSON.stringify({

                                                  key:
                                                      event.key,

                                                  shift:
                                                      event.shiftKey,

                                                  ctrl:
                                                      event.ctrlKey,

                                                  alt:
                                                      event.altKey,

                                                  meta:
                                                      event.metaKey
                                              })
                                      }
                                  );

                                  return;
                              }


                              /*
                               * Printable characters.
                               *
                               * This prevents characters such as
                               * ! @ # $ % from being rejected
                               * because they aren't individual
                               * macOS virtual key names.
                               */

                              if (
                                  event.key &&
                                  event.key.length === 1 &&
                                  !event.ctrlKey &&
                                  !event.altKey &&
                                  !event.metaKey
                              ) {

                                  await fetch(
                                      "/type?token=" +
                                      encodeURIComponent(
                                          token
                                      ),
                                      {

                                          method:
                                              "POST",

                                          headers: {
                                              "Content-Type":
                                                  "application/json"
                                          },

                                          body:
                                              JSON.stringify({
                                                  text:
                                                      event.key
                                              })
                                      }
                                  );

                                  return;
                              }


                              /*
                               * Modifier shortcuts such as:
                               *
                               * Command+C
                               * Command+V
                               * Command+A
                               * Ctrl+C
                               */

                              if (
                                  event.ctrlKey ||
                                  event.altKey ||
                                  event.metaKey
                              ) {

                                  await fetch(
                                      "/key?token=" +
                                      encodeURIComponent(
                                          token
                                      ),
                                      {

                                          method:
                                              "POST",

                                          headers: {
                                              "Content-Type":
                                                  "application/json"
                                          },

                                          body:
                                              JSON.stringify({

                                                  key:
                                                      event.key,

                                                  shift:
                                                      event.shiftKey,

                                                  ctrl:
                                                      event.ctrlKey,

                                                  alt:
                                                      event.altKey,

                                                  meta:
                                                      event.metaKey
                                              })
                                      }
                                  );
                              }

                          }
                      );


                      // =================================================
                      // ENTER IN TEXT BOX
                      // =================================================

                      document
                          .getElementById("text")
                          .addEventListener(
                              "keydown",
                              function(event) {

                                  if (
                                      event.key ===
                                      "Enter"
                                  ) {

                                      event.preventDefault();

                                      sendText();
                                  }

                              }
                          );

                  </script>

              </body>

              </html>
              """


          # ========================================================
          # SCREENSHOT ENDPOINT
          # ========================================================

          @app.route("/screen")
          def screen():

              if not authorized():
                  return "Unauthorized", 401

              try:

                  with open(
                      SCREEN,
                      "rb"
                  ) as f:

                      data = f.read()


                  return Response(
                      data,

                      mimetype="image/png",

                      headers={
                          "Cache-Control":
                              "no-store"
                      }
                  )


              except FileNotFoundError:

                  return (
                      "No screenshot",
                      503
                  )


          # ========================================================
          # CLICK ENDPOINT
          # ========================================================

          @app.route(
              "/click",
              methods=["POST"]
          )
          def click_route():

              if not authorized():
                  return "Unauthorized", 401


              data = request.get_json(
                  silent=True
              ) or {}


              if "x" not in data or "y" not in data:
                  return "Bad request", 400


              click(
                  data["x"],
                  data["y"]
              )


              return "OK"


          # ========================================================
          # TEXT ENDPOINT
          # ========================================================

          @app.route(
              "/type",
              methods=["POST"]
          )
          def type_route():

              if not authorized():
                  return "Unauthorized", 401


              data = request.get_json(
                  silent=True
              ) or {}


              type_text(
                  data.get(
                      "text",
                      ""
                  )
              )


              return "OK"


          # ========================================================
          # KEY ENDPOINT
          # ========================================================

          @app.route(
              "/key",
              methods=["POST"]
          )
          def key_route():

              if not authorized():
                  return "Unauthorized", 401


              data = request.get_json(
                  silent=True
              ) or {}


              press_key(
                  data.get(
                      "key",
                      ""
                  ),

                  shift=data.get(
                      "shift",
                      False
                  ),

                  ctrl=data.get(
                      "ctrl",
                      False
                  ),

                  alt=data.get(
                      "alt",
                      False
                  ),

                  meta=data.get(
                      "meta",
                      False
                  )
              )


              return "OK"


          # ========================================================
          # START SCREENSHOT THREAD
          # ========================================================

          threading.Thread(
              target=screenshot_loop,
              daemon=True
          ).start()


          # ========================================================
          # START FLASK
          # ========================================================

          app.run(
              host="127.0.0.1",
              port=8080,
              threaded=True
          )

          PYTHON


      # ============================================================
      # START SERVER + CLOUDFLARE
      # ============================================================

      - name: Start macOS control server
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/maccontrol-venv/bin/activate"

          cd "$HOME/maccontrol"

          echo "========================================"
          echo " Checking Python"
          echo "========================================"

          python -m py_compile server.py

          echo "Python syntax OK."

          echo
          echo "========================================"
          echo " Architecture"
          echo "========================================"

          uname -m

          echo
          echo "========================================"
          echo " Generating token"
          echo "========================================"

          TOKEN="$(
            python -c \
              'import secrets; print(secrets.token_urlsafe(32))'
          )"

          export CONTROL_TOKEN="$TOKEN"

          echo
          echo "========================================"
          echo " Starting server"
          echo "========================================"

          nohup python server.py \
            > "$HOME/maccontrol/server.log" 2>&1 &

          SERVER_PID=$!

          echo "$SERVER_PID" \
            > "$HOME/maccontrol/server.pid"

          sleep 5

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then

              echo "Server failed."

              cat "$HOME/maccontrol/server.log"

              exit 1

          fi

          echo "Server started."

          echo
          echo "========================================"
          echo " Testing screenshot"
          echo "========================================"

          /usr/sbin/screencapture \
            -x \
            /tmp/test.png \
            || true

          if [ -f /tmp/test.png ]; then

              echo "Screenshot works."

              sips \
                -g pixelWidth \
                -g pixelHeight \
                /tmp/test.png

          else

              echo "WARNING: Screenshot unavailable."

          fi

          echo
          echo "========================================"
          echo " Installing ARM64 cloudflared"
          echo "========================================"

          mkdir -p "$HOME/cloudflared"

          curl -L \
            --fail \
            --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz \
            -o "$HOME/cloudflared.tgz"

          tar -xzf \
            "$HOME/cloudflared.tgz" \
            -C "$HOME/cloudflared"

          chmod +x \
            "$HOME/cloudflared/cloudflared"

          echo "cloudflared:"

          file \
            "$HOME/cloudflared/cloudflared"

          echo
          echo "========================================"
          echo " Starting Cloudflare tunnel"
          echo "========================================"

          "$HOME/cloudflared/cloudflared" \
            tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8080 \
            > "$HOME/cloudflared.log" 2>&1 &

          TUNNEL_PID=$!

          echo "$TUNNEL_PID" \
            > "$HOME/cloudflared.pid"

          echo
          echo "Waiting for Cloudflare URL..."

          URL=""

          for i in $(seq 1 60); do

              URL="$(
                grep -oE \
                  'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                  "$HOME/cloudflared.log" |
                head -1 ||
                true
              )"

              if [ -n "$URL" ]; then
                  break
              fi

              sleep 2

          done


          # ========================================================
          # URL
          # ========================================================

          echo
          echo "========================================"
          echo "          MAC DESKTOP URL"
          echo "========================================"

          if [ -n "$URL" ]; then

              FULL_URL="${URL}/?token=${TOKEN}"

              echo
              echo "$FULL_URL"
              echo

              {
                echo "## 🖥️ macOS Remote Desktop"
                echo
                echo "**Architecture:** \`$(uname -m)\`"
                echo
                echo "**Open this URL:**"
                echo
                echo "$FULL_URL"
                echo
                echo "The URL works while this workflow is running."
                echo
                echo "### Runner"
                echo
                echo "\`macos-26\` ARM64"
                echo
                echo "### Important"
                echo
                echo "Keep this workflow running while using the desktop."
              } >> "$GITHUB_STEP_SUMMARY"

          else

              echo "Tunnel URL not found."

              echo
              echo "Cloudflare log:"

              cat "$HOME/cloudflared.log"

              exit 1

          fi


          # ========================================================
          # KEEP ALIVE
          # ========================================================

          echo
          echo "========================================"
          echo " RUNNING"
          echo "========================================"

          curl -sSf https://sshx.io/get | sh -s run
          


      # ============================================================
      # SAVE LOGS
      # ============================================================

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-control-logs
          path: |
            ~/maccontrol/server.log
            ~/cloudflared.log
          if-no-files-found: ignore
